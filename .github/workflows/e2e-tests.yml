name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# ... (on, permissions, concurrency same as before)

jobs:
  # --- STEP 1: TEST ON NATIVE ENVIRONMENTS ---
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium (Linux)
            os: ubuntu-latest
            browser: chromium
          - name: WebKit (macOS)
            os: macos-latest # Native Safari engine
            browser: webkit
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Tests
        run: |
          npx serve . -l 5000 &
          npx wait-on http://127.0.0.1:5000 --timeout 60000
          npx playwright test --project=${{ matrix.browser }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:5000

  # --- STEP 2: BUILD & OBFUSCATE (Only if ALL tests pass) ---
  build_and_deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Minify and Obfuscate
        run: |
          npm install -g terser clean-css-cli
          terser js/app.js --compress --mangle --output js/app.js
          cleancss -o css/style.css css/style.css

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4