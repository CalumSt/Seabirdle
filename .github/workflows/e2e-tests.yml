name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# ... (on, permissions, concurrency same as before)

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update Fixtures
        run: python3 scripts/update_cypress_fixture.py

      - name: Start Server and Wait
        run: |
          npx serve . -l 5000 &
          sleep 5 # Give it a literal 5 seconds to settle
          npx wait-on http://127.0.0.1:5000 --timeout 60000

      - name: Run Playwright tests
        run: npx playwright test --config playwright.config.js
        env:
          # This ensures Playwright knows where to look
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:5000

      # ── BUILD & OBFUSCATE ──
      - name: Minify and Obfuscate
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g terser clean-css-cli
          terser app.js --compress --mangle --output app.js
          cleancss -o style.css style.css

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4