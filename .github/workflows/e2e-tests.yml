name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update Fixtures
        run: python3 scripts/update_cypress_fixture.py

      - name: Run Playwright tests
        run: npx playwright test

      # ── BUILD & OBFUSCATE ──
      # Only runs if tests pass. This mangles the JS to hide answers.
      - name: Minify and Obfuscate
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g terser clean-css-cli
          terser app.js --compress --mangle --output app.js
          cleancss -o style.css style.css

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: test_and_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4