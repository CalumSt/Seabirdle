name: End-to-End Tests & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── JOB 1: TEST ────────────────────────────────────────────────────────────
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Using the predefined Microsoft Playwright image
    # This skips the "npx playwright install" download step entirely.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Caches node_modules based on package-lock.json

      - name: Install dependencies
        run: npm ci # Use 'ci' for faster, more reliable installs in GitHub Actions

      - name: Update Fixtures
        run: python3 scripts/update_cypress_fixture.py

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ── JOB 2: DEPLOY ──────────────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4